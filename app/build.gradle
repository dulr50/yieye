import com.android.build.api.artifact.SingleArtifact

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

def keystorePropertiesFile = file('../keystore/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.yieye.xiangqi'
    compileSdk 36

    defaultConfig {
        applicationId "com.yieye.xiangqi"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 显式指定 ABI，确保只打包 arm64 架构
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    androidResources {
        noCompress 'pikafish.nnue'
    }

    // 关键：防止系统对 .so 文件进行压缩，这样它才具备执行权限
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

}

// 打包完成后复制到的目录
def outputApkDir = "${project.projectDir.absolutePath}/build/apk"

androidComponents {
    onVariants(selector().all()) { variant ->
        // 确定输出文件名
        variant.outputs.forEach { output ->
            output.outputFileName.set("yi_${variant.buildType}_${android.defaultConfig.versionName}.apk")
        }

        // 打包完成后做的一些事,复制apk到指定文件夹
        def copyApkTask = tasks.register("copyApk${variant.name.capitalize()}", Copy) {
            from variant.artifacts.get(SingleArtifact.APK.INSTANCE)
            into outputApkDir
        }
        afterEvaluate {
            tasks.named("assemble${variant.name.capitalize()}").configure {
                finalizedBy(copyApkTask)
            }
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.material
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.activity
    implementation libs.androidx.work.runtime.ktx
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
}